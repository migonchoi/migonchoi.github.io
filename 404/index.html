<!DOCTYPE html> <html> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="utf-8"> <title>Redirecting...</title> <script>
    // 링크드인 등 외부에서 붙인 추적 파라미터(?li_fat_id=... 등)를 제거한 순수 경로 추출
    var cleanPath = window.location.pathname;
    
    // 끝에 슬래시(/)가 빠진 경우 자동으로 붙여서 404 방지
    if (!cleanPath.endsWith('/') && !cleanPath.includes('.')) {
      cleanPath += '/';
    }
    
    // 순수한 원본 URL로 강제 이동 (파라미터 제거)
    window.location.replace(window.location.protocol + "//" + window.location.host + cleanPath);
  </script> </head> <body> </body> </html>
