<!DOCTYPE html>
<html lang="en" data-lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decision Layer: a live demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fs-display:clamp(1.6rem,4.2vw,2.45rem); --fs-h2:1.5rem; --fs-num:1.4rem;
  --fs-lead:1.05rem; --fs-body:.92rem; --fs-small:.78rem; --fs-label:.72rem;
  --bg:#0A1210; --surface:#121F1D; --surface2:#162624;
  --line:#1F3532; --line2:#2A4642;
  --text:#E8F2EE; --muted:#8AA5A0; --dim:#5E7A75;
  --run:#3DDCA0; --repeat:#F5B93B; --defer:#FF7566; --stop:#79A6FF; --true:#3DDCA0;
  --glow:0 0 0 1px rgba(61,220,160,.25), 0 8px 30px -12px rgba(61,220,160,.35);
  --primaryText:#04110D;
  --fs-h1:clamp(1.6rem,4.2vw,2.4rem);
  --fs-action:clamp(1.3rem,3.2vw,1.6rem);
  --fs-num:1.35rem;
  --fs-lead:1.08rem;
  --fs-body:.95rem;
  --fs-small:.8rem;
  --fs-label:.7rem;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#F4F8F6; --surface:#FFFFFF; --surface2:#F7FBF9;
  --line:#DCE8E4; --line2:#C6D9D4;
  --text:#0F1D1A; --muted:#5A716C; --dim:#7D948E;
  --run:#0E9E70; --repeat:#B07807; --defer:#D3402F; --stop:#2A5BD7; --true:#0E9E70;
  --glow:0 0 0 1px rgba(14,158,112,.2), 0 10px 26px -16px rgba(14,158,112,.5);
  --primaryText:#FFFFFF;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F8F6; --surface:#FFFFFF; --surface2:#F7FBF9;
    --line:#DCE8E4; --line2:#C6D9D4;
    --text:#0F1D1A; --muted:#5A716C; --dim:#7D948E;
    --run:#0E9E70; --repeat:#B07807; --defer:#D3402F; --stop:#2A5BD7; --true:#0E9E70;
    --glow:0 0 0 1px rgba(14,158,112,.2), 0 10px 26px -16px rgba(14,158,112,.5);
    --primaryText:#FFFFFF;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-size:var(--fs-body);line-height:1.6;
  font-family:Arial,"Helvetica Neue",Helvetica,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  background-image:radial-gradient(60rem 30rem at 72% -12%, rgba(61,220,160,.08), transparent 70%);
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:66rem;margin:0 auto;padding:1.75rem 1rem 3.5rem}

header{display:flex;gap:1rem;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.eyebrow{display:flex;align-items:center;gap:.5rem;font-size:var(--fs-label);letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin:0 0 .7rem}
.led{width:.5rem;height:.5rem;border-radius:50%;background:var(--run);box-shadow:0 0 10px var(--run);flex:none}
h1{margin:0 0 .7rem;font-size:var(--fs-h1);line-height:1.15;letter-spacing:-.02em;font-weight:700;max-width:34ch}
h1 em{font-style:normal;color:var(--run)}
.sub{margin:0;color:var(--muted);max-width:46rem;font-size:var(--fs-body)}
.switches{display:flex;gap:.4rem}
.chip{border:1px solid var(--line2);background:var(--surface);color:var(--muted);border-radius:99px;
  padding:.35rem .85rem;font:inherit;font-size:var(--fs-small);cursor:pointer;transition:color .15s,border-color .15s}
.chip:hover{color:var(--text);border-color:var(--run)}
.chip:focus-visible,.btn:focus-visible,.preset:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--run);outline-offset:3px}

.question{margin-top:1.5rem;border:1px solid var(--line2);border-left:3px solid var(--stop);border-radius:12px;
  background:var(--surface);padding:.9rem 1.1rem}
.question .q-lab{font-size:var(--fs-small);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.question p{margin:.35rem 0 0;font-size:var(--fs-lead);font-weight:600;line-height:1.45;max-width:42rem}
.question .crit{color:var(--muted);font-size:var(--fs-body);font-weight:400;margin-top:.55rem;max-width:46rem}

.dia{width:100%;max-width:44rem;height:auto;display:block;margin:.2rem 0 .6rem}
.dbox{fill:var(--surface);stroke:var(--line2)}
.dbox.mid{stroke:var(--run);fill:var(--surface2)}
.dtxt{fill:var(--text);font-size:13px;font-weight:600;font-family:Arial,Helvetica,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.dsub{fill:var(--muted);font-size:11.5px;font-family:Arial,Helvetica,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.darr{stroke:var(--line2);stroke-width:1.5;fill:none}
.dback{stroke:var(--dim);stroke-width:1.2;fill:none;stroke-dasharray:4 4}
.about{margin-top:.7rem;max-width:52rem}
.about p{margin:0}
.sec-head{margin:2rem 0 .6rem;font-size:var(--fs-label);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.faq{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.7rem;margin-top:.2rem}
.faq .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.85rem .95rem}
.faq h3{margin:0 0 .3rem;font-size:var(--fs-body);font-weight:600;color:var(--text)}
.faq p{margin:0;font-size:var(--fs-body);color:var(--muted);line-height:1.55}

.grid{display:grid;grid-template-columns:minmax(0,20rem) minmax(0,1fr);gap:1rem;margin-top:1rem;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.15rem}
.panel h2{margin:0 0 1rem;font-size:var(--fs-label);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600;
  display:flex;justify-content:space-between;align-items:center;gap:.5rem}

.presets{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:1rem}
.preset{border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:99px;
  padding:.3rem .75rem;font:inherit;font-size:var(--fs-small);cursor:pointer;transition:.15s}
.preset:hover{color:var(--text);border-color:var(--run)}
.preset[aria-pressed="true"]{color:var(--primaryText);background:var(--run);border-color:var(--run);font-weight:600}

.field{margin:1rem 0}
.field label{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;font-size:var(--fs-body);margin-bottom:.45rem}
.field .val{font-size:var(--fs-body);font-weight:600;color:var(--run)}
.field .val.warn{color:var(--defer)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1.1rem;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:.3rem;border-radius:99px;background:var(--line2)}
input[type=range]::-moz-range-track{height:.3rem;border-radius:99px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.05rem;height:1.05rem;border-radius:50%;
  background:var(--run);margin-top:-.38rem;box-shadow:0 0 0 4px rgba(61,220,160,.18)}
input[type=range]::-moz-range-thumb{width:1.05rem;height:1.05rem;border:0;border-radius:50%;background:var(--run);
  box-shadow:0 0 0 4px rgba(61,220,160,.18)}
.hint{font-size:var(--fs-small);color:var(--dim);margin:.3rem 0 0;line-height:1.5}

.modebox{margin:1.1rem 0 .2rem;padding:.75rem .85rem;border-radius:10px;border:1px solid var(--line2);background:var(--surface2)}
.modebox b{font-size:var(--fs-body);display:block;margin-bottom:.4rem}
.seg{display:flex;gap:.25rem;background:var(--bg);border-radius:8px;padding:.2rem}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:var(--fs-small);
  padding:.35rem .4rem;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.modebox small{display:block;color:var(--dim);font-size:var(--fs-small);line-height:1.45;margin-top:.45rem}

.rec{display:flex;gap:.7rem;align-items:center;margin:.7rem 0 .2rem;padding:.7rem .8rem;border-radius:10px;
  border:1px solid var(--line2);background:var(--surface2);cursor:pointer;position:relative}
.rec input{position:absolute;opacity:0;width:0;height:0}
.track{width:2.5rem;height:1.4rem;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:background .18s}
.track::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1rem;height:1rem;border-radius:50%;
  background:var(--dim);transition:transform .18s,background .18s}
.rec input:checked + .track{background:rgba(61,220,160,.28)}
.rec input:checked + .track::after{transform:translateX(1.1rem);background:var(--run)}
.rec b{font-size:var(--fs-body);font-weight:600;display:block}
.rec small{color:var(--dim);font-size:var(--fs-small);line-height:1.4;display:block}

details.adv{margin-top:.8rem;border:1px solid var(--line2);border-radius:10px;background:var(--surface2)}
details.adv summary{cursor:pointer;padding:.6rem .8rem;font-size:var(--fs-label);color:var(--muted);font-weight:600;list-style:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:"▸ ";color:var(--dim)}
details.adv[open] summary::before{content:"▾ "}
.advbody{padding:0 .8rem .8rem;display:grid;gap:.55rem}
.num{display:grid;grid-template-columns:1fr 5.2rem;gap:.5rem;align-items:center;font-size:var(--fs-small);color:var(--muted)}
.num input{background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:6px;
  padding:.28rem .4rem;font:inherit;font-size:var(--fs-small);width:100%;
  font-family:"IBM Plex Mono",monospace}
.advnote{font-size:var(--fs-small);color:var(--dim);line-height:1.45;margin:.2rem 0 0}

.actions{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:.7rem 1rem;font:inherit;font-size:var(--fs-body);font-weight:600;cursor:pointer;transition:.15s}
.btn.primary{flex:1 1 10rem;background:var(--run);color:var(--primaryText);box-shadow:var(--glow)}
.btn.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--run)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}

.verdict{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--dim);border-radius:14px;padding:1.2rem 1.3rem;min-height:11rem}
.verdict[data-a="RUN"]{border-left-color:var(--run)} .verdict[data-a="REPEAT"]{border-left-color:var(--repeat)}
.verdict[data-a="DEFER"]{border-left-color:var(--defer)} .verdict[data-a="STOP"]{border-left-color:var(--stop)}
.vhead{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.vaction{font-size:var(--fs-action);font-weight:700;letter-spacing:-.01em;line-height:1.1}
.verdict[data-a="RUN"] .vaction{color:var(--run)} .verdict[data-a="REPEAT"] .vaction{color:var(--repeat)}
.verdict[data-a="DEFER"] .vaction{color:var(--defer)} .verdict[data-a="STOP"] .vaction{color:var(--stop)}
.verdict[data-a="IDLE"] .vaction{color:var(--dim)}
.vday{font-size:var(--fs-label);letter-spacing:.14em;color:var(--dim);border:1px solid var(--line2);border-radius:99px;padding:.15rem .65rem}
.vmode{font-size:var(--fs-label);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.vtitle{margin:.55rem 0 0;font-size:var(--fs-body);font-weight:500}
.vreason{margin:.5rem 0 0;color:var(--muted);font-size:var(--fs-body)}
.evidence{list-style:none;margin:.9rem 0 0;padding:0;display:grid;gap:.3rem}
.evidence li{font-size:var(--fs-small);color:var(--muted);padding-left:1rem;position:relative}
.evidence li::before{content:"";position:absolute;left:0;top:.62em;width:.35rem;height:.35rem;border-radius:50%;background:var(--line2)}


.lead-note{font-size:var(--fs-body);color:var(--muted);line-height:1.55;margin:0 0 .9rem}
.cost-note{font-size:var(--fs-small);color:var(--dim);margin:.55rem 0 0;line-height:1.5}
.runsleft{font-size:var(--fs-small);color:var(--dim);margin:.5rem 0 0}
.today{margin:.7rem 0 0;font-size:var(--fs-small);color:var(--dim);font-family:"IBM Plex Mono",monospace}
.tour{display:none}
.tour .step{display:grid;grid-template-columns:1.5rem 1fr;gap:.55rem;align-items:start;text-align:left;
  border:1px solid var(--line2);background:transparent;border-radius:10px;padding:.55rem .7rem;font:inherit;cursor:pointer;transition:.15s}
.tour .step:hover{border-color:var(--run)}
.tour .step[data-done="1"]{border-color:var(--run);background:var(--surface2)}
.tour .n{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--line2);color:var(--text);
  font-size:var(--fs-small);font-weight:700;display:flex;align-items:center;justify-content:center}
.tour .step[data-done="1"] .n{background:var(--run);color:var(--primaryText)}
.tour b{display:block;font-size:var(--fs-body);font-weight:600;color:var(--text)}
.tour small{display:block;font-size:var(--fs-small);color:var(--muted);line-height:1.45}
details.manual{margin-top:.9rem;border:1px solid var(--line2);border-radius:10px;background:var(--surface2)}
details.manual > summary{cursor:pointer;padding:.6rem .8rem;font-size:var(--fs-label);color:var(--muted);font-weight:600;list-style:none}
details.manual > summary::-webkit-details-marker{display:none}
details.manual > summary::before{content:"▸ ";color:var(--dim)}
details.manual[open] > summary::before{content:"▾ "}
.manual-body{padding:0 .8rem .8rem}
.hidden{display:none !important}
.vsummary{margin:.55rem 0 0;font-size:var(--fs-lead);line-height:1.5}
.vsummary .hl{font-weight:700;font-size:1.18em;color:var(--defer);letter-spacing:-.01em}
details.tech{margin-top:.8rem}
details.tech > summary{cursor:pointer;font-size:var(--fs-label);color:var(--dim);list-style:none}
details.tech > summary::-webkit-details-marker{display:none}
details.tech > summary::before{content:"▸ ";}
details.tech[open] > summary::before{content:"▾ ";}
.legend-note{font-size:var(--fs-small);color:var(--dim);margin:.5rem 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.6rem,1fr));gap:.6rem;margin-top:.9rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem}
.stat b{display:block;font-size:var(--fs-num);font-weight:600;line-height:1.2}
.stat span{font-size:var(--fs-label);color:var(--dim);letter-spacing:.05em}
.stat.bad b{color:var(--dim)} .stat.bad.on b{color:var(--defer)}
.stat.good b{color:var(--run)}

.lower{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1rem;margin-top:.9rem}
@media (max-width:920px){ .grid{grid-template-columns:1fr} .lower{grid-template-columns:1fr} }

svg.chart{width:100%;height:auto;display:block}
.gridline{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.axis{stroke:var(--line2);stroke-width:1}
.band{fill:var(--stop);fill-opacity:.18}
.mline{fill:none;stroke:var(--stop);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{fill:var(--stop)}
.trueline{stroke:var(--true);stroke-width:1.5;stroke-dasharray:5 4}
.targetline{stroke:var(--repeat);stroke-width:1.2;stroke-dasharray:2 3}
.tick{fill:var(--dim);font-size:13px;font-family:"IBM Plex Mono",monospace}
.axtitle{fill:var(--muted);font-size:14px;font-weight:500}
.chart-empty{fill:var(--dim);font-size:13px}
.chart-note{font-size:var(--fs-body);color:var(--dim);margin:.6rem 0 0}
.est-now{font-size:var(--fs-lead);font-weight:600;color:var(--stop)}

.strip{display:flex;flex-wrap:wrap;gap:4px;min-height:1.6rem}
.cell{width:1rem;height:1.5rem;border-radius:3px;background:var(--line2);position:relative}
.cell.RUN{background:var(--run)} .cell.REPEAT{background:var(--repeat)}
.cell.DEFER{background:var(--defer)} .cell.STOP{background:var(--stop)}
.cell.valid::after{content:"";position:absolute;inset:2px;border:1.5px solid var(--surface);border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .8rem;margin-top:.7rem;font-size:var(--fs-small);color:var(--dim)}
.legend i{display:inline-block;width:.7rem;height:.9rem;border-radius:2px;vertical-align:-.1rem;margin-right:.3rem}
.log{margin-top:.9rem;max-height:11rem;overflow-y:auto}
.log-row{display:grid;grid-template-columns:2.4rem 5.2rem 1fr;gap:.5rem;font-size:var(--fs-small);padding:.35rem 0;border-bottom:1px solid var(--line)}
.log-row:last-child{border-bottom:0}
.log-row .n{color:var(--dim)}
.log-row .a{font-weight:600}
.log-row .a.RUN{color:var(--run)} .log-row .a.REPEAT{color:var(--repeat)}
.log-row .a.DEFER{color:var(--defer)} .log-row .a.STOP{color:var(--stop)}
.log-row .d{color:var(--muted)}

.diag{margin-top:.9rem}
.diag-sum{display:flex;flex-wrap:wrap;gap:.4rem .5rem;margin:0 0 .9rem}
.pill{font-size:var(--fs-small);border:1px solid var(--line2);border-radius:99px;padding:.2rem .65rem;color:var(--muted)}
.pill b{color:var(--text);font-weight:600}
.pill.run{border-color:var(--run);color:var(--run)} .pill.defer{border-color:var(--defer);color:var(--defer)}
.finding{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.7rem;padding:.75rem 0;border-top:1px solid var(--line)}
.finding:first-of-type{border-top:0;padding-top:.2rem}
.sev{width:.45rem;border-radius:99px;background:var(--line2);min-height:100%}
.sev.high{background:var(--defer)} .sev.med{background:var(--repeat)} .sev.info{background:var(--stop)}
.sev.good{background:var(--run)}
.finding h3{margin:0 0 .25rem;font-size:var(--fs-body);font-weight:600}
.finding p{margin:0;font-size:var(--fs-body);color:var(--muted)}
.finding p.act{margin-top:.35rem;color:var(--text);font-size:var(--fs-body)}
.finding p.act b{font-weight:600;color:var(--run)}
.diag-empty{font-size:var(--fs-body);color:var(--dim);margin:0}


.notes{margin-top:1.6rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:.8rem}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.05rem}
.note h3{margin:0 0 .4rem;font-size:var(--fs-body);font-weight:600}
.note p{margin:0 0 .5rem;font-size:var(--fs-body);color:var(--muted);line-height:1.6}
.note p:last-child{margin-bottom:0}
.note.cta{border-color:var(--run);box-shadow:var(--glow)}
.note.cta h3{color:var(--run)}

footer{margin-top:1.6rem;border-top:1px solid var(--line);padding-top:1rem;color:var(--dim);font-size:var(--fs-small)}
footer p{margin:.35rem 0;max-width:54rem}
@media (prefers-reduced-motion:no-preference){
  .verdict{animation:rise .28s ease-out}
  @keyframes rise{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
  .cell{animation:pop .22s ease-out both}
  @keyframes pop{from{opacity:0;transform:scaleY(.4)}to{opacity:1;transform:none}}
  .led{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <p class="eyebrow"><span class="led"></span><span data-t="eyebrow"></span></p>
    <h1 data-t="title"></h1>
    <p class="sub" data-t="sub"></p>
  </div>
  <div class="switches">
    <button class="chip" id="lang" type="button">한국어</button>
    <button class="chip" id="theme" type="button" data-t="themeBtn"></button>
  </div>
</header>

<div class="question">
  <p id="q-text"></p>
  <p class="crit" id="q-crit"></p>
</div>

<div class="about">
  <svg id="dia" class="dia" viewBox="0 0 720 104" role="img" aria-label="model to decision layer to lab"></svg>
</div>

<div class="grid">
  <section class="panel" aria-labelledby="h-cond">
    <h2 id="h-cond"><span data-t="condHead"></span><span class="mono" id="dayBadge">D0</span></h2>
    <p class="lead-note" data-t="leadNote"></p>
    <div class="actions" style="margin-top:0">
      <button class="btn primary" id="go" type="button" data-t="goAuto"></button>

function fmt(s,o){return s.replace(/\{(\w+)\}/g,function(_,k){return o[k];});}
function sup(n){var m={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
  return String(n).split("").map(function(c){return m[c]||c;}).join("");}
function sci(lg){var e=Math.floor(lg), m=Math.pow(10,lg-e);
  if(m>=9.5){m=1;e+=1;}
  return (Math.round(m*10)/10)+"×10"+sup(e)+" cm⁻³";}
function times(r){return r>=10?Math.round(r):(Math.round(r*10)/10);}
function usd(v){return "$"+Math.round(v).toLocaleString("en-US");}
function gauss(){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function log10(x){return Math.log(x)/Math.LN10;}
function oxidation(o2,age){var ex=0;
  if(o2>0.2) ex+=Math.pow(10,14.35+1.25*log10(o2/0.2)+0.25*gauss());
  if(age>7) ex+=Math.pow(10,13.8+0.045*(age-7)+0.25*gauss());
  return ex;}
function runExperiment(o2,age){
  var base=14.5+0.25*gauss(), delta=TRUE_DELTA+0.25*gauss();
  var pfail=Math.min(0.55,0.06+(o2>0.2?0.16*log10(o2/0.2)+0.1:0));
  function mk(dop){var n=Math.pow(10,base+0.2*gauss()+(dop?delta:0))+oxidation(o2,age)*Math.pow(10,0.3*gauss());
    return {log:log10(n),ok:Math.random()>pfail};}
  var c=[],d=[],i;
  for(i=0;i<N_CTRL;i++)c.push(mk(false));
  for(i=0;i<N_DOPED;i++)d.push(mk(true));
  return {c:c,d:d,contaminated:(o2>0.2||age>7)};
}
function median(a){var b=a.slice().sort(function(x,y){return x-y;}),m=b.length>>1;
  return b.length%2?b[m]:(b[m-1]+b[m])/2;}
function mean(a){return a.reduce(function(s,x){return s+x;},0)/a.length;}
function sdev(a){if(a.length<2)return 0;var m=mean(a);
  return Math.sqrt(a.reduce(function(s,x){return s+(x-m)*(x-m);},0)/(a.length-1));}
function ciOf(a){return a.length>1?1.96*sdev(a)/Math.sqrt(a.length):9;}

/* ---------- headless evaluation of one run, shared by UI and Monte Carlo ---------- */
function evaluate(o2,age,rec,mode,valid){
  var out={},t;
  if(rec && o2>CFG.o2){
    out.flagged=true;
    if(mode==="blocking"){ out.action="DEFER"; out.type="env"; out.madeFilms=false; return out; }
    out.overridden=true;
  }
  out.madeFilms=true;
  var r=runExperiment(o2,age);
  out.contaminated=r.contaminated;
  var cok=r.c.filter(function(x){return x.ok;}).map(function(x){return x.log;});
  var dok=r.d.filter(function(x){return x.ok;}).map(function(x){return x.log;});
  out.nfail=NF-(cok.length+dok.length); out.ncok=cok.length;
  if(!cok.length||!dok.length){ out.action="DEFER"; out.type="ft"; return out; }
  var med=median(cok), spread=Math.max.apply(null,cok)-Math.min.apply(null,cok);
  out.med=med; out.spread=spread;
  if(med>CFG.hi){ out.action="DEFER"; out.type="high"; return out; }
  if(med<CFG.lo){ out.action="DEFER"; out.type="low"; return out; }
  if(spread>CFG.spread){ out.action="DEFER"; out.type="spread"; return out; }
  out.delta=mean(dok)-med; out.type="valid";
  var v=valid.concat([out.delta]), n=v.length, ci=ciOf(v);
  out.n=n; out.est=mean(v); out.ciVal=ci; out.sd=sdev(v);
  if(n>=CFG.min && ci<=CFG.ci){ out.action="STOP"; }
  else if(n===1){ out.action="RUN"; }
  else if(n<CFG.min){ out.action="REPEAT"; }
  else { out.action="REPEAT"; out.noisy=true; }
  return out;
}

/* ---------- one interactive step ---------- */
function compose(r){
  var t=T[L], ev=[];
  var todayLine=fmt(t.todayLine,{o2:r.o2.toFixed(2),h2o:r.h2o.toFixed(2),age:r.age,
      state:(r.leak?t.stateLeak:t.stateOk)+(r.age>7?" "+t.stateAged:"")});
  if(r.blocked){
    return {action:"DEFER",day:r.day,today:todayLine,plain:t.pEnvB,
            title:fmt(t.vDeferEnv,{o2:r.o2.toFixed(2)}),reason:fmt(t.rDeferEnvB,{th:CFG.o2}),evidence:[]};
  }
  if(!r.rec) ev.push(t.eNoRecord);
  if(r.overridden) ev.push(t.eIgnored);
  if(r.contaminated) ev.push(fmt(t.eWasted,{cost:usd(NF*CFG.film)}));
  if(r.nfail) ev.push(fmt(t.eFT,{nfail:r.nfail}));
  if(r.med!==undefined && r.med!==null) ev.unshift(fmt(t.eControl,{med:r.med.toFixed(2),nc:N_CTRL,ncok:r.ncok}));
  var title,reason,plain, refLog=(CFG.lo+CFG.hi)/2;
  if(r.action==="DEFER"){
    title=t.vDeferQC;
    plain = r.type==="ft" ? t.pFT
          : r.type==="high" ? fmt(t.pHigh,{ref:sci(refLog),val:sci(r.med),x:times(Math.pow(10,r.med-refLog))})
          : r.type==="low"  ? fmt(t.pLow ,{ref:sci(refLog),val:sci(r.med),x:times(Math.pow(10,refLog-r.med))})
          : t.pSpread;
    if(r.overridden) plain=t.pEnvA+" "+plain;
    if(r.type==="ft") reason=t.rDeferFT;
    else if(r.type==="high") reason=fmt(t.rDeferQC,{med:r.med.toFixed(2)});
    else if(r.type==="low") reason=fmt(t.rDeferQCLow,{med:r.med.toFixed(2)});
    else reason=fmt(t.rDeferSpread,{spread:r.spread.toFixed(2)});
    if(r.overridden){ title=fmt(t.vDeferEnv,{o2:r.o2.toFixed(2)}); reason=fmt(t.rDeferEnvA,{th:CFG.o2})+" "+reason; }
  } else if(r.action==="STOP"){
    title=t.vStop; plain=fmt(t.pStop,{n:r.n});
    reason=fmt(t.rStop,{n:r.n,est:r.est.toFixed(2),ci:r.ciVal.toFixed(2),target:CFG.target.toFixed(1),
      verdictWord:(r.est-r.ciVal>=CFG.target?t.above:t.below)});
    ev.push(fmt(t.eDoped,{delta:r.delta.toFixed(2)}));
  } else {
    ev.push(fmt(t.eDoped,{delta:r.delta.toFixed(2)}));
    if(r.action==="RUN"){ title=t.vRunFirst; reason=t.rRunFirst; plain=t.pRun; }
    else if(r.noisy){ title=t.vRepeat; reason=fmt(t.rRepeatNoisy,{sd:r.sd.toFixed(2)}); plain=t.pNoisy; }
    else { title=t.vRepeat; reason=fmt(t.rRepeat,{n:r.n}); plain=fmt(t.pRepeat,{n:r.n}); }
  }
  return {action:r.action,day:r.day,today:todayLine,plain:plain,title:title,reason:reason,evidence:ev};
}
function detailOf(r){
  var t=T[L];
  if(r.blocked) return fmt(t.logDefer,{o2:r.o2.toFixed(2)});
  if(r.overridden) return fmt(t.logDeferA,{o2:r.o2.toFixed(2)});
  if(r.action==="DEFER"){
    if(r.type==="ft") return t.logFT;
    if(r.type==="spread") return fmt(t.logSpread,{spread:r.spread.toFixed(2)});
    return fmt(t.logCtrl,{med:r.med.toFixed(2)});
  }
  return fmt(t.logValid,{delta:r.delta.toFixed(2)});
}
function step(){
  var t=T[L];
  if(st.done){ $("vsummary").textContent=t.done; return; }
  if(st.days>=MAX_DAYS){ $("vsummary").textContent=t.capReached; $("go").disabled=true; $("auto").disabled=true; return; }
  if(!manualOpen()) autoConditions();
  var o2=+$("o2").value, h2o=+$("h2o").value, age=+$("age").value, rec=$("rec").checked;
  st.days++;
  var leakNow = manualOpen() ? (o2>CFG.o2) : st.leak;
  var e=evaluate(o2,age,rec,MODE,st.valid);
  var r={day:st.days,o2:o2,h2o:h2o,age:age,rec:rec,leak:leakNow,
         flagged:!!e.flagged,overridden:!!e.overridden,blocked:!!(e.flagged&&!e.madeFilms),
         type:e.type,nfail:e.nfail||0,ncok:e.ncok,med:e.med,spread:e.spread,
         contaminated:!!e.contaminated,action:e.action,n:e.n,est:e.est,ciVal:e.ciVal,sd:e.sd,
         delta:e.delta,noisy:!!e.noisy};
  if(r.blocked){
    r.action="DEFER"; st.savedFilms+=NF;
    st.hist.push(Object.assign(r,{valid:false,detail:detailOf(r)}));
    st.last=r; verdict(compose(r)); renderStats(); renderLog(); renderDiagnosis(); return;
  }
  st.films+=NF;
  if(e.contaminated) st.waste+=NF;
  if(e.action!=="DEFER"){ st.valid.push(e.delta); if(e.action==="STOP") st.done=true; }
  st.hist.push(Object.assign(r,{valid:e.action!=="DEFER",detail:detailOf(r)}));
  st.last=r; verdict(compose(r));
  renderStats(); renderLog(); renderChart(); renderDiagnosis();
  $("go").disabled=st.done; $("auto").disabled=st.done;
}
function auto(){
  var i=0,leak=0;
  var iv=setInterval(function(){
    if(st.done||i>=10||st.days>=MAX_DAYS){clearInterval(iv);return;}
    if(leak>0)leak--; else if(Math.random()<0.3)leak=1+Math.floor(Math.random()*3);
    $("o2").value=(leak>0?(0.6+Math.random()*2.5):(0.07+Math.random()*0.1)).toFixed(2);
    $("h2o").value=(leak>0?(0.8+Math.random()*1.5):(0.07+Math.random()*0.5)).toFixed(2);
    Array.prototype.forEach.call($("presets").children,function(x){x.setAttribute("aria-pressed","false");});
    sync(); step(); i++;
  },560);
}

/* ---------- wiring ---------- */
["o2","h2o","age"].forEach(function(id){
  $(id).oninput=function(){
    Array.prototype.forEach.call($("presets").children,function(x){x.setAttribute("aria-pressed","false");});
    sync();};
});
Array.prototype.forEach.call($("modeSeg").children,function(b){
  b.onclick=function(){ MODE=b.getAttribute("data-mode"); renderMode(); };
});
var advMap={"a-lo":"lo","a-hi":"hi","a-spread":"spread","a-o2":"o2","a-min":"min","a-ci":"ci",
            "a-target":"target","a-film":"film","a-day":"day"};
Object.keys(advMap).forEach(function(id){
  $(id).onchange=function(){
    var v=parseFloat($(id).value);
    if(!isNaN(v)){ CFG[advMap[id]]=v; }
    renderQuestion(); sync(); renderStats(); renderChart(); renderDiagnosis();
  };
});
$("go").onclick=step; $("auto").onclick=auto;
$("reset").onclick=function(){
  st={days:0,films:0,waste:0,valid:[],hist:[],done:false,ignored:0,savedFilms:0};
  $("go").disabled=false; $("auto").disabled=false;
  renderStats(); renderLog(); renderChart(); renderDiagnosis(); idle();};

$("lang").onclick=function(){L=(L==="en"?"ko":"en"); applyLang();};
$("theme").onclick=function(){
  var dark=document.documentElement.getAttribute("data-theme")!=="light";
  document.documentElement.setAttribute("data-theme",dark?"light":"dark");
  $("theme").textContent=dark?(L==="en"?"Dark":"다크"):(L==="en"?"Light":"라이트");
  renderChart(); renderDiagram();};
applyLang();
})();
</script>
</body>
